[build]
  # 4K素材(videos/)とローカル確認用サーバー(server.ps1)は配信しない
  command = "mkdir -p _site && cp -r index.html style.css main.js assets frames _site/"
  publish = "_site"

# フレームは差し替えない限り中身が変わらないので長期キャッシュさせる
[[headers]]
  for = "/frames/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
